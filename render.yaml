services:
  - type: web
    name: argos-worldwide-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: argos-worldwide-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGIN
        value: "https://argos-worldwide.vercel.app,http://localhost:3000"
      - key: UPLOAD_MAX_SIZE
        value: 10485760
      - key: ADMIN_EMAIL
        value: admin@argosworldwide.com
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Argos Worldwide Website <no-reply@argosworldwide.com>"
      - key: CONTACT_NOTIFY_EMAIL
        value: arthur@argosworldwide.com

databases:
  - name: argos-worldwide-postgres
    plan: free